<!DOCTYPE html>
<html>

<head>

    <title>AI Travel Planner</title>

    <style>

        body{
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .container{
            width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input, select{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button{
            width: 100%;
            padding: 12px;
            background: blue;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        #result{
            margin-top: 20px;
            background: #eeeeee;
            padding: 15px;
            border-radius: 10px;
            white-space: pre-wrap;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AI Travel Planner</h1>

        <input type="text" id="destination" placeholder="Destination">

        <input type="number" id="days" placeholder="Days">

        <input type="number" id="budget" placeholder="Budget">

        <select id="vibe">
            <option>Adventure</option>
            <option>Religious</option>
            <option>Leisure</option>
        </select>

        <select id="season">
            <option>Summer</option>
            <option>Winter</option>
            <option>Monsoon</option>
        </select>

        <button onclick="generateTrip()">
            Generate Trip
        </button>

        <div id="result"></div>

    </div>

    <script>

        async function generateTrip(){

            const destination =
                document.getElementById("destination").value;

            const days =
                document.getElementById("days").value;

            const budget =
                document.getElementById("budget").value;

            const vibe =
                document.getElementById("vibe").value;

            const season =
                document.getElementById("season").value;

            try{

                const response = await fetch(
                    "http://127.0.0.1:5000/generate-trip",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            destination: destination,
                            days: days,
                            budget: budget,
                            vibe: vibe,
                            season: season

                        })

                    }
                );

                const data = await response.json();

                document.getElementById("result").innerHTML =

                    `
                    <h3>Itinerary</h3>
                    <p>${data.itinerary}</p>

                    <h3>Budget</h3>
                    <pre>${JSON.stringify(data.budget, null, 2)}</pre>

                    <h3>Recommendations</h3>
                    <p>${data.recommendations}</p>
                    `;

            }

            catch(error){

                document.getElementById("result").innerHTML =
                    "Error: " + error;

                console.log(error);
            }

        }

    </script>

</body>

</html>
